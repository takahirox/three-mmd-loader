<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Standalone MMD examples</title>
	<link rel="stylesheet" href="./browser.css">
	<script type="module" src="./browser.js"></script>
</head>
<body>
	<aside id="panel">
		<header id="header">
			<h1><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a></h1>
			<span id="sections">MMD examples</span>
			<button id="expandButton" type="button" aria-label="Toggle examples" aria-controls="contentWrapper" aria-expanded="false">☰</button>
		</header>
		<div id="panelScrim" aria-hidden="true"></div>
		<nav id="contentWrapper" aria-label="MMD examples">
			<button id="closeButton" type="button">Close examples</button>
			<div id="content">
				<h2>webgl / loaders / mmd</h2>
				<div class="card" data-example="webgl_loader_mmd">
					<a href="./webgl_loader_mmd.html" target="viewer">
						<div class="cover"><img src="./screenshots/webgl_loader_mmd.jpg" width="400" height="250" alt="Miku dancing on a grid"></div>
						<div class="title">Model and animation</div>
					</a>
				</div>
				<div class="card" data-example="webgl_loader_mmd_audio">
					<a href="./webgl_loader_mmd_audio.html" target="viewer">
						<div class="cover"><img src="./screenshots/webgl_loader_mmd_audio.jpg" width="400" height="250" alt="Miku in the audio and animated camera scene"></div>
						<div class="title">Audio and camera animation</div>
					</a>
				</div>
				<div class="card" data-example="webgl_loader_mmd_pose">
					<a href="./webgl_loader_mmd_pose.html" target="viewer">
						<div class="cover"><img src="./screenshots/webgl_loader_mmd_pose.jpg" width="400" height="250" alt="Miku demonstrating a VPD pose"></div>
						<div class="title">Poses</div>
					</a>
				</div>
				<p class="credits">Scenes using this repository's MMD loader and animation helper.<br>
					<a href="./README.md" target="_blank" rel="noopener">Setup, asset terms, and credits</a><br>
					<a href="./assets/mmd/Readme.txt" target="_blank" rel="noopener">MMD asset license summary</a>
				</p>
			</div>
		</nav>
	</aside>
	<main id="viewerArea">
		<div id="placeholder">
			<h2>Standalone MMD examples</h2>
			<p>Select an example from the panel to view it here.</p>
		</div>
		<iframe id="viewer" name="viewer" title="Selected MMD example" allow="fullscreen" hidden></iframe>
	</main>
</body>
</html>
