name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Build generated example fixtures (validation only)
        run: npm run build:examples
        env:
          MMD_EXAMPLE_FIXTURES: '1'
      - name: Validate the fixture site under the existing Pages path
        run: npm run test:examples
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MMD_EXAMPLE_SITE: dist/examples
      - run: npm pack --dry-run
      - name: Validate npm release lifecycle (dry-run only, no upload)
        run: npm publish --dry-run --access public
