<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local PMX bone morph and SDEF inspection</title>
<style>body{margin:0;font:14px system-ui;background:#20242b;color:white}canvas{display:block}#panel{position:absolute;top:12px;left:12px;max-width:440px;padding:12px;background:#18202de8}label{display:block;margin:8px 0}input[type=text]{width:100%;box-sizing:border-box}button,select,input{font:inherit}#status{white-space:pre-wrap}</style>
<script type="importmap">{"imports":{
"three":"/node_modules/three/build/three.module.js",
"three/webgpu":"/node_modules/three/build/three.webgpu.js",
"three/tsl":"/node_modules/three/build/three.tsl.js",
"three/addons/":"/node_modules/three/examples/jsm/",
"mmd-parser":"/node_modules/mmd-parser/build/mmdparser.module.mjs",
"three-mmd-loader":"/src/index.js"}}</script></head>
<body><div id="panel">
<strong>Private PMX bone morph and SDEF inspection</strong>
<label>Local directory <select id="asset-directory"><option value="yyb-miku-10th">yyb-miku-10th/</option><option value="bone-morph">bone-morph/</option></select></label>
<label>PMX path relative to the selected directory<input id="model" type="text" value="model.pmx"></label>
<button id="load">Load PMX</button>
<label>Direct type 2 morph <select id="morph" disabled></select></label>
<label>Weight <input id="weight" type="range" min="0" max="1" step="0.01" value="0" disabled> <span id="weight-value">0.00</span></label>
<pre id="morph-info" style="max-height:220px;overflow:auto;white-space:pre-wrap">Load a PMX to enumerate its actual type 2 bone morphs.</pre>
<label>Bone <select id="bone"></select></label>
<label>Bend axis <select id="axis"><option>x</option><option>y</option><option>z</option></select></label>
<label>Bend <input id="bend" type="range" min="-150" max="150" value="0"> <span id="degrees">0°</span></label>
<button id="reset">Reset pose</button>
<label><input id="bdef" type="checkbox"> Compare using BDEF2</label>
<label>Optional VMD path relative to the selected directory<input id="motion" type="text" placeholder="motion.vmd"></label>
<button id="play">Play local motion</button><button id="stop">Stop motion</button>
<p id="status">Review the model's README/license locally before loading. Assets remain on this loopback server.</p>
</div><script type="module" src="/local-sdef/viewer.js"></script></body></html>
